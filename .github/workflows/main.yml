name: Ecart CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & PHPUnit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: intl, mbstring, json, xml, sqlite3
        coverage: none

    - name: Install Dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Run PHP Lint (Syntax Check)
      run: find app tests -name "*.php" -exec php -l {} \; | grep -v "No syntax errors" || true

    - name: Run PHPUnit Tests
      run: vendor/bin/phpunit --no-coverage

  sast-scan:
    name: SAST (SonarCloud Scan)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true 

  deploy-to-cpanel:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: [lint-and-test, sast-scan]
    
    # ONLY deploy if on the main branch
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/Ecart/

  dast-scan:
    name: DAST (OWASP ZAP Live Scan)
    runs-on: ubuntu-latest
    # We must wait for the deployment to finish so we scan the newly updated code
    needs: deploy-to-cpanel
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'https://hivetask.com/Ecart'
      continue-on-error: true 
